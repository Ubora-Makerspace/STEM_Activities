<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/></marker></defs>
<rect width="640" height="210" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold">What the Arduino does with your sketch</text>
<rect x="30" y="60" width="150" height="60" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="105" y="86" text-anchor="middle" font-weight="bold">Power on</text><text x="105" y="104" text-anchor="middle" font-size="12">or press reset</text>
<rect x="245" y="60" width="150" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="320" y="86" text-anchor="middle" font-weight="bold">setup()</text><text x="320" y="104" text-anchor="middle" font-size="12">runs once</text>
<rect x="460" y="60" width="150" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="535" y="86" text-anchor="middle" font-weight="bold">loop()</text><text x="535" y="104" text-anchor="middle" font-size="12">runs again and again</text>
<g stroke="#1565c0" stroke-width="2" fill="none"><path d="M180,90 H243" marker-end="url(#m)"/><path d="M395,90 H458" marker-end="url(#m)"/>
<path d="M565,120 C565,175 505,175 505,122" marker-end="url(#m)"/></g>
<text x="535" y="195" text-anchor="middle" font-size="12" fill="#1565c0">back to the top, forever</text>
</svg>
