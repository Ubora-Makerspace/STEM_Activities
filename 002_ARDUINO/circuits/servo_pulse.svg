<g stroke="#999" stroke-width="1.5" fill="none"><line x1="60" y1="296" x2="460" y2="296"/><line x1="60" y1="290" x2="60" y2="302"/><line x1="460" y1="290" x2="460" y2="302"/></g>
<text x="260" y="320" text-anchor="middle" font-size="12">one period = 20 ms, repeated 50 times every second</text>
