<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/></marker></defs>
<rect width="620" height="270" fill="#fff"/>
<text x="310" y="22" text-anchor="middle" font-size="15" font-weight="bold">Active low: the pin sinks current</text>
<rect x="450" y="60" width="140" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="520" y="85" text-anchor="middle" font-weight="bold">Arduino</text>
<text x="462" y="114">pin 8</text>
<text x="40" y="118" font-weight="bold">5V</text>
<g stroke="#212121" stroke-width="2" fill="none">
<path d="M70,110 H130"/><path d="M190,110 H240"/><path d="M270,110 H450"/>
</g>
<rect x="130" y="98" width="60" height="24" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
<text x="160" y="115" text-anchor="middle" font-size="12">220Ω</text>
<polygon points="240,94 240,126 270,110" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
<line x1="270" y1="94" x2="270" y2="126" stroke="#c62828" stroke-width="3"/>
<text x="255" y="150" text-anchor="middle" font-size="11">LED</text>
<line x1="90" y1="75" x2="430" y2="75" stroke="#1565c0" stroke-width="2" marker-end="url(#b)"/>
<text x="260" y="68" text-anchor="middle" fill="#1565c0" font-size="12">current flows into the pin</text>
<text x="310" y="228" text-anchor="middle">pin 8 LOW (0 V): current flows to the pin, LED on</text>
<text x="310" y="248" text-anchor="middle">pin 8 HIGH (5 V): 5 V on both sides, LED off</text>
</svg>
