<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold">Potentiometer on A0, servo on pin 9</text>
<rect x="240" y="50" width="160" height="220" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="320" y="72" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<g font-size="12"><text x="250" y="114">5V</text><text x="250" y="164">A0</text><text x="250" y="214">GND</text></g>
<g font-size="12" text-anchor="end"><text x="392" y="119">~9</text><text x="392" y="169">5V</text><text x="392" y="219">GND</text></g>
<rect x="50" y="100" width="90" height="30" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
<text x="95" y="120" text-anchor="middle" font-size="12">10kΩ pot</text>
<path d="M140,108 H175 V110 H240" stroke="#c62828" stroke-width="2" fill="none"/>
<path d="M95,130 V160 H240" stroke="#2e7d32" stroke-width="2" fill="none"/>
<path d="M50,115 H30 V210 H240" stroke="#212121" stroke-width="2" fill="none"/>
<text x="150" y="98" font-size="11" fill="#c62828">outer leg to 5V</text>
<text x="100" y="152" font-size="11" fill="#2e7d32">wiper</text>
<rect x="480" y="95" width="120" height="140" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
<text x="540" y="125" text-anchor="middle" font-weight="bold">Servo</text>
<text x="540" y="143" text-anchor="middle" font-size="11">(SG90 or similar)</text>
<path d="M480,115 H400" stroke="#ef6c00" stroke-width="3"/>
<path d="M480,165 H400" stroke="#c62828" stroke-width="3"/>
<path d="M480,215 H400" stroke="#6d4c41" stroke-width="3"/>
<g font-size="11" fill="#555" text-anchor="middle"><text x="440" y="108">signal (orange)</text><text x="440" y="158">power (red)</text><text x="440" y="208">ground (brown)</text></g>
<text x="320" y="300" text-anchor="middle" font-size="12" fill="#555">The pot and servo share 5V and GND. Use the breadboard rails to split them.</text>
</svg>
