<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Helvetica, Arial, sans-serif"><rect width="980" height="400" fill="#ffffff"/><text x="250" y="36" font-size="20" text-anchor="middle" fill="#d62828" font-weight="bold">WRONG: two separate zeros</text><text x="720" y="36" font-size="20" text-anchor="middle" fill="#2a9d3f" font-weight="bold">RIGHT: one shared zero</text><rect x="30" y="70" width="150" height="230" rx="8" fill="#eef3fb" stroke="#334155" stroke-width="2"/><text x="105.0" y="94" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Arduino</text><rect x="320" y="70" width="150" height="230" rx="8" fill="#fdf0e6" stroke="#334155" stroke-width="2"/><text x="395.0" y="94" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Motor circuit</text><text x="395" y="200" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">battery + motor</text><polyline points="180,130 320,130" fill="none" stroke="#1d70d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="120" font-size="12" text-anchor="middle" fill="#1d70d6" font-weight="normal">signal</text><circle cx="180" cy="130" r="4" fill="#334155"/><text x="170" y="134" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Pin 5</text><circle cx="320" cy="130" r="4" fill="#334155"/><text x="330" y="134" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Signal in</text><circle cx="180" cy="250" r="4" fill="#334155"/><text x="170" y="254" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">GND</text><circle cx="320" cy="250" r="4" fill="#334155"/><text x="330" y="254" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">GND</text><text x="250" y="254" font-size="13" text-anchor="middle" fill="#d62828" font-weight="bold">no wire</text><rect x="500" y="70" width="150" height="230" rx="8" fill="#eef3fb" stroke="#334155" stroke-width="2"/><text x="575.0" y="94" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Arduino</text><rect x="790" y="70" width="150" height="230" rx="8" fill="#fdf0e6" stroke="#334155" stroke-width="2"/><text x="865.0" y="94" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Motor circuit</text><text x="865" y="200" font-size="12" text-anchor="middle" fill="#555" font-weight="normal">battery + motor</text><polyline points="650,130 790,130" fill="none" stroke="#1d70d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="720" y="120" font-size="12" text-anchor="middle" fill="#1d70d6" font-weight="normal">signal</text><circle cx="650" cy="130" r="4" fill="#334155"/><text x="640" y="134" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">Pin 5</text><circle cx="790" cy="130" r="4" fill="#334155"/><text x="800" y="134" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">Signal in</text><circle cx="650" cy="250" r="4" fill="#334155"/><text x="640" y="254" font-size="13" text-anchor="end" fill="#222222" font-weight="normal">GND</text><circle cx="790" cy="250" r="4" fill="#334155"/><text x="800" y="254" font-size="13" text-anchor="start" fill="#222222" font-weight="normal">GND</text><polyline points="650,250 790,250" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="720" y="238" font-size="12" text-anchor="middle" fill="#2a9d3f" font-weight="bold">common ground</text><text x="250" y="340" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Pin 5 says 5 V, but 5 V above what?</text><text x="250" y="360" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">The motor side has a different zero, so the signal means nothing.</text><text x="720" y="340" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">Both sides measure from the same zero,</text><text x="720" y="360" font-size="13" text-anchor="middle" fill="#555" font-weight="normal">so 5 V means the same thing to both.</text></svg>