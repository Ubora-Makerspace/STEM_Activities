<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f9a825"/></marker></defs>
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold">Two ways to read light with a fast sensor</text>
<!-- phototransistor -->
<text x="150" y="48" text-anchor="middle">5V</text>
<g stroke="#212121" stroke-width="2" fill="none">
<path d="M150,55 V94"/><path d="M150,126 V165"/><path d="M150,165 H250"/>
<path d="M150,185 V165"/><path d="M150,235 V268"/>
</g>
<circle cx="150" cy="165" r="3" fill="#212121"/>
<circle cx="140" cy="110" r="24" fill="none" stroke="#212121" stroke-width="2"/>
<line x1="132" y1="98" x2="132" y2="122" stroke="#212121" stroke-width="3"/>
<line x1="132" y1="105" x2="150" y2="94" stroke="#212121" stroke-width="2"/>
<line x1="132" y1="115" x2="150" y2="126" stroke="#212121" stroke-width="2"/>
<line x1="70" y1="70" x2="105" y2="95" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
<line x1="70" y1="90" x2="105" y2="112" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="185" width="20" height="50" fill="#fff" stroke="#212121" stroke-width="2"/>
<text x="168" y="215">10kΩ</text>
<text x="185" y="110" font-size="11">collector (top)</text>
<text x="185" y="138" font-size="11">emitter (bottom)</text>
<text x="255" y="169">to A0</text>
<text x="150" y="286" text-anchor="middle">GND</text>
<text x="150" y="308" text-anchor="middle" font-weight="bold">Phototransistor</text>
<!-- photodiode -->
<text x="470" y="48" text-anchor="middle">5V</text>
<g stroke="#212121" stroke-width="2" fill="none">
<path d="M470,55 V95"/><path d="M470,125 V165"/><path d="M470,165 H570"/>
<path d="M470,185 V165"/><path d="M470,235 V268"/>
</g>
<circle cx="470" cy="165" r="3" fill="#212121"/>
<polygon points="456,125 484,125 470,98" fill="#e3f2fd" stroke="#212121" stroke-width="2"/>
<line x1="456" y1="95" x2="484" y2="95" stroke="#212121" stroke-width="3"/>
<line x1="400" y1="70" x2="440" y2="100" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="90" x2="440" y2="118" stroke="#f9a825" stroke-width="2" marker-end="url(#a)"/>
<rect x="460" y="185" width="20" height="50" fill="#fff" stroke="#212121" stroke-width="2"/>
<text x="488" y="215">100kΩ+</text>
<text x="495" y="100" font-size="11">cathode (bar)</text>
<text x="495" y="132" font-size="11">anode</text>
<text x="575" y="169">to A0</text>
<text x="470" y="286" text-anchor="middle">GND</text>
<text x="470" y="308" text-anchor="middle" font-weight="bold">Photodiode (reverse biased)</text>
</svg>
