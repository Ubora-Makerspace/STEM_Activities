<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Connecting the Arduino to the Raspberry Pi Zero 2 W</text>

  <!-- Pi -->
  <rect x="30" y="70" width="200" height="180" rx="10" fill="#fde8ec" stroke="#b71c3c" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-weight="bold" font-size="16" fill="#b71c3c">Raspberry Pi</text>
  <text x="110" y="170" text-anchor="middle" font-weight="bold" font-size="16" fill="#b71c3c">Zero 2 W</text>
  <text x="218" y="125" text-anchor="end" font-size="12" fill="#b71c3c">USB (data)</text>
  <text x="218" y="215" text-anchor="end" font-size="12" fill="#b71c3c">PWR IN</text>
  <circle cx="230" cy="130" r="5" fill="#333"/>
  <circle cx="230" cy="210" r="5" fill="#333"/>

  <!-- OTG adapter -->
  <rect x="290" y="105" width="110" height="50" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="345" y="127" text-anchor="middle" font-size="12" fill="#00695c">micro-USB OTG</text>
  <text x="345" y="143" text-anchor="middle" font-size="12" fill="#00695c">adapter</text>
  <line x1="230" y1="130" x2="290" y2="130" stroke="#222" stroke-width="3"/>

  <!-- Cable -->
  <line x1="400" y1="130" x2="560" y2="130" stroke="#222" stroke-width="3"/>
  <text x="480" y="108" text-anchor="middle" font-size="12" fill="#222">USB-A to USB-B cable</text>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="#222">(a DATA cable)</text>

  <!-- Arduino -->
  <rect x="560" y="70" width="210" height="180" rx="10" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="665" y="150" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f4e79">Arduino Uno</text>
  <text x="665" y="172" text-anchor="middle" font-size="12" fill="#1f4e79">sensor and servo wiring:</text>
  <text x="665" y="188" text-anchor="middle" font-size="12" fill="#1f4e79">see robot_wiring.svg</text>
  <circle cx="560" cy="130" r="5" fill="#333"/>

  <!-- Power supply -->
  <rect x="290" y="190" width="150" height="50" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="365" y="212" text-anchor="middle" font-size="12" fill="#6a1b9a">5 V power supply</text>
  <text x="365" y="228" text-anchor="middle" font-size="12" fill="#6a1b9a">(2.5 A, micro-USB)</text>
  <line x1="230" y1="210" x2="290" y2="210" stroke="#222" stroke-width="3"/>

  <!-- Data flow arrow -->
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">&lt;-- DIST,42.6 lines flow from the Arduino to the Pi</text>

  <!-- Notes -->
  <rect x="30" y="275" width="740" height="65" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <g font-size="13" fill="#333">
    <text x="45" y="297">• The Pi powers the Arduino through the USB cable. The servo has its own AA pack (see robot_wiring.svg).</text>
    <text x="45" y="317">• Use the middle micro-USB port marked "USB" for the Arduino. The port marked "PWR IN" is only for power.</text>
    <text x="45" y="334">• Never power the Pi from the Arduino. Never connect the HC-SR04 ECHO pin to a Pi GPIO pin (it is 5 V).</text>
  </g>
</svg>
