<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="660" height="340" fill="#fff"/>
<text x="330" y="22" text-anchor="middle" font-size="15" font-weight="bold">The pulse width tells a servo which angle to turn to</text>
