<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="700" height="370" fill="#fff"/>
<text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold">The Arduino Uno, from above</text>
<rect x="170" y="90" width="440" height="200" rx="10" fill="#00838f" stroke="#005662" stroke-width="2"/>
<rect x="130" y="120" width="70" height="60" fill="#bdbdbd" stroke="#616161" stroke-width="2"/>
<rect x="130" y="215" width="70" height="55" fill="#424242" stroke="#212121" stroke-width="2"/>
<circle cx="250" cy="125" r="11" fill="#e53935" stroke="#7f0000" stroke-width="2"/>
<rect x="430" y="170" width="140" height="36" fill="#263238"/>
<text x="500" y="193" text-anchor="middle" fill="#fff" font-size="12">ATmega328P</text>
<line x1="310" y1="102" x2="582" y2="102" stroke="#212121" stroke-width="12" stroke-dasharray="12 8"/>
<line x1="260" y1="278" x2="392" y2="278" stroke="#212121" stroke-width="12" stroke-dasharray="12 8"/>
<line x1="420" y1="278" x2="532" y2="278" stroke="#212121" stroke-width="12" stroke-dasharray="12 8"/>
<rect x="300" y="165" width="10" height="10" fill="#ffa000"/><rect x="318" y="165" width="10" height="10" fill="#ffca28"/>
<rect x="336" y="165" width="10" height="10" fill="#ffca28"/><rect x="354" y="165" width="10" height="10" fill="#66bb6a"/>
<g fill="#fff" font-size="10" text-anchor="middle"><text x="305" y="187">L</text><text x="323" y="187">TX</text><text x="341" y="187">RX</text><text x="359" y="187">ON</text></g>
<g fill="#fff" font-size="10"><text x="312" y="124">0</text><text x="572" y="124">13</text><text x="422" y="266">A0</text><text x="520" y="266">A5</text></g>
<text x="330" y="235" fill="#fff" font-size="11" text-anchor="middle">L = built-in LED (pin 13)</text>
<text x="500" y="250" fill="#fff" font-weight="bold" font-size="14" text-anchor="middle">ARDUINO UNO</text>
<g stroke="#555" stroke-width="1.5" fill="none">
<path d="M446,74 V92"/><path d="M230,62 L248,112"/><path d="M326,326 V284"/><path d="M476,326 V284"/>
<path d="M126,150 H130"/><path d="M126,243 H130"/>
</g>
<g text-anchor="middle"><text x="446" y="52" font-weight="bold">Digital pins 0 to 13</text><text x="446" y="68" font-size="11">(~ marks the PWM pins: 3, 5, 6, 9, 10, 11)</text>
<text x="215" y="54" font-weight="bold">Reset button</text>
<text x="326" y="344" font-weight="bold">Power pins</text><text x="326" y="360" font-size="11">3.3V, 5V, GND, VIN</text>
<text x="476" y="344" font-weight="bold">Analog inputs</text><text x="476" y="360" font-size="11">A0 to A5</text></g>
<g text-anchor="end"><text x="122" y="147" font-weight="bold">USB port</text><text x="122" y="162" font-size="11">power + upload</text>
<text x="122" y="240" font-weight="bold">Power jack</text><text x="122" y="255" font-size="11">7 to 12 V</text></g>
</svg>
