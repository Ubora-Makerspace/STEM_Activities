<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Robot wiring: ultrasonic sensor and servo</text>

  <!-- USB -->
  <rect x="20" y="120" width="40" height="60" rx="4" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <text x="40" y="155" text-anchor="middle" font-size="12" fill="#263238">USB</text>
  <text x="40" y="200" text-anchor="middle" font-size="12" fill="#263238">to Pi /</text>
  <text x="40" y="215" text-anchor="middle" font-size="12" fill="#263238">laptop</text>

  <!-- Arduino -->
  <rect x="60" y="70" width="200" height="330" rx="10" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="130" y="240" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f4e79">Arduino Uno</text>
  <g text-anchor="end" fill="#1f4e79">
    <text x="248" y="115">5V</text>
    <text x="248" y="155">D7</text>
    <text x="248" y="195">D8</text>
    <text x="248" y="235">GND</text>
    <text x="248" y="335">D9</text>
  </g>
  <text x="160" y="386" text-anchor="middle" fill="#1f4e79">GND</text>
  <g fill="#333">
    <circle cx="260" cy="110" r="4"/><circle cx="260" cy="150" r="4"/><circle cx="260" cy="190" r="4"/>
    <circle cx="260" cy="230" r="4"/><circle cx="260" cy="330" r="4"/><circle cx="160" cy="400" r="4"/>
  </g>

  <!-- HC-SR04 -->
  <rect x="560" y="80" width="190" height="170" rx="10" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
  <text x="690" y="170" text-anchor="middle" font-weight="bold" font-size="16" fill="#b26a00">HC-SR04</text>
  <g fill="#b26a00">
    <text x="572" y="115">VCC</text>
    <text x="572" y="155">TRIG</text>
    <text x="572" y="195">ECHO</text>
    <text x="572" y="235">GND</text>
  </g>
  <g fill="#333">
    <circle cx="560" cy="110" r="4"/><circle cx="560" cy="150" r="4"/><circle cx="560" cy="190" r="4"/><circle cx="560" cy="230" r="4"/>
  </g>

  <!-- Sensor wires -->
  <line x1="260" y1="110" x2="560" y2="110" stroke="#d62728" stroke-width="3"/>
  <line x1="260" y1="150" x2="560" y2="150" stroke="#2a7de1" stroke-width="3"/>
  <line x1="260" y1="190" x2="560" y2="190" stroke="#8e44ad" stroke-width="3"/>
  <line x1="260" y1="230" x2="560" y2="230" stroke="#222" stroke-width="3"/>
  <g font-size="12" text-anchor="middle">
    <text x="410" y="103" fill="#d62728">5 V</text>
    <text x="410" y="143" fill="#2a7de1">D7 → TRIG</text>
    <text x="410" y="183" fill="#8e44ad">D8 → ECHO</text>
    <text x="410" y="223" fill="#222">GND</text>
    <text x="410" y="323" fill="#e67e22">D9 → signal</text>
  </g>

  <!-- Servo -->
  <rect x="560" y="300" width="190" height="130" rx="10" fill="#eaf7ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="370" text-anchor="middle" font-weight="bold" font-size="16" fill="#2e7d32">Servo</text>
  <g fill="#2e7d32">
    <text x="572" y="335">Signal</text>
    <text x="572" y="375">+ (red)</text>
    <text x="572" y="415">− (brown)</text>
  </g>
  <g fill="#333">
    <circle cx="560" cy="330" r="4"/><circle cx="560" cy="370" r="4"/><circle cx="560" cy="410" r="4"/>
  </g>
  <polyline points="260,330 560,330" fill="none" stroke="#e67e22" stroke-width="3"/>

  <!-- Battery pack -->
  <rect x="300" y="470" width="140" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="312" y="500" font-weight="bold" fill="#6a1b9a">4 × AA pack</text>
  <text x="312" y="520" font-size="12" fill="#6a1b9a">about 6 V</text>
  <text x="426" y="494" text-anchor="end" font-weight="bold" fill="#d62728">+</text>
  <text x="426" y="520" text-anchor="end" font-weight="bold" fill="#222">−</text>
  <circle cx="440" cy="490" r="4" fill="#333"/>
  <circle cx="440" cy="515" r="4" fill="#333"/>

  <!-- Battery wires -->
  <polyline points="440,490 490,490 490,370 560,370" fill="none" stroke="#d62728" stroke-width="3"/>
  <polyline points="440,515 520,515 520,410 560,410" fill="none" stroke="#222" stroke-width="3"/>

  <!-- Common ground -->
  <polyline points="160,400 160,565 500,565 500,515" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="500" cy="515" r="5" fill="#2e7d32"/>
  <text x="330" y="588" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Common ground: Arduino GND joined to battery −</text>

  <!-- Notes -->
  <rect x="560" y="470" width="220" height="100" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <g font-size="12" fill="#333">
    <text x="572" y="495">Servo power: AA pack,</text>
    <text x="572" y="512">NOT the Arduino 5V pin.</text>
    <text x="572" y="532">Only the grounds are joined.</text>
    <text x="572" y="552">Arduino power: USB from the Pi.</text>
  </g>
</svg>
