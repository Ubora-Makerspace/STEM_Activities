<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="520" height="320" fill="#ffffff"/>
<text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold">PWM signal at different duty cycles (5V logic)</text>
<g fill="none" stroke="#1565c0" stroke-width="3">
<path d="M60,70 V30 H110 V70 H260 V30 H310 V70 H460"/>
<path d="M60,170 V130 H160 V170 H260 V130 H360 V170 H460"/>
<path d="M60,270 V230 H210 V270 H260 V230 H410 V270 H460"/>
</g>
<g fill="#333">
<text x="10" y="50">25%</text><text x="10" y="150">50%</text><text x="10" y="250">75%</text>
<text x="470" y="35">5V</text><text x="470" y="75">0V</text>
<text x="470" y="135">5V</text><text x="470" y="175">0V</text>
<text x="470" y="235">5V</text><text x="470" y="275">0V</text>
<text x="85" y="88" text-anchor="middle" font-size="11">ON</text>
<text x="185" y="88" text-anchor="middle" font-size="11">OFF</text>
<text x="160" y="300" text-anchor="middle">one period (T)</text>
</g>
<g stroke="#999" stroke-dasharray="4 3"><line x1="60" y1="290" x2="60" y2="300"/><line x1="260" y1="290" x2="260" y2="300"/><line x1="60" y1="295" x2="260" y2="295"/></g>
</svg>
