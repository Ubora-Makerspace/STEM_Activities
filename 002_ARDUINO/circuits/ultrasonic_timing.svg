<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="u" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1565c0"/></marker>
<marker id="v" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62828"/></marker></defs>
<rect width="640" height="400" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold">How the HC-SR04 measures distance</text>
<rect x="30" y="55" width="70" height="70" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<circle cx="52" cy="90" r="14" fill="#fff" stroke="#1565c0" stroke-width="2"/><circle cx="80" cy="90" r="14" fill="#fff" stroke="#1565c0" stroke-width="2"/>
<text x="65" y="148" text-anchor="middle" font-size="11">HC-SR04</text>
<g stroke="#1565c0" stroke-width="2" fill="none"><path d="M120,65 Q145,90 120,115"/><path d="M140,58 Q175,90 140,122"/><path d="M160,51 Q205,90 160,129"/></g>
<rect x="520" y="50" width="20" height="90" fill="#bdbdbd" stroke="#616161" stroke-width="2"/>
<text x="530" y="158" text-anchor="middle" font-size="11">object</text>
<line x1="230" y1="75" x2="512" y2="75" stroke="#1565c0" stroke-width="2" marker-end="url(#u)"/>
<text x="370" y="68" text-anchor="middle" font-size="11" fill="#1565c0">sound goes out</text>
<line x1="512" y1="105" x2="230" y2="105" stroke="#c62828" stroke-width="2" marker-end="url(#v)"/>
<text x="370" y="123" text-anchor="middle" font-size="11" fill="#c62828">echo comes back</text>
<g stroke="#555" stroke-width="1.5" fill="none"><line x1="100" y1="170" x2="520" y2="170"/><line x1="100" y1="164" x2="100" y2="176"/><line x1="520" y1="164" x2="520" y2="176"/></g>
<text x="310" y="190" text-anchor="middle" font-size="12">distance = (echo time x 0.0343 cm per µs) / 2</text>
<text x="40" y="228" font-weight="bold" font-size="12">TRIG</text>
<path d="M90,248 H130 V222 H150 V248 H590" fill="none" stroke="#1565c0" stroke-width="3"/>
<text x="140" y="214" text-anchor="middle" font-size="11">10 µs pulse from Arduino</text>
<text x="40" y="318" font-weight="bold" font-size="12">ECHO</text>
<path d="M90,338 H260 V312 H470 V338 H590" fill="none" stroke="#c62828" stroke-width="3"/>
<g stroke="#999" stroke-dasharray="4 3"><line x1="150" y1="248" x2="150" y2="345"/><line x1="260" y1="248" x2="260" y2="345"/><line x1="470" y1="248" x2="470" y2="345"/></g>
<text x="205" y="290" text-anchor="middle" font-size="11" fill="#555">sensor sends</text><text x="205" y="304" text-anchor="middle" font-size="11" fill="#555">the sound burst</text>
<text x="365" y="365" text-anchor="middle" font-size="12" fill="#c62828">ECHO stays HIGH for the round-trip time (pulseIn measures this)</text>
</svg>
