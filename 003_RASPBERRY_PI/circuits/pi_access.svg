<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How your laptop reaches the Pi (no screen needed)</text>

  <!-- SSH arc label -->
  <path d="M130 80 Q 400 20 670 80" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="670,80 656,70 654,84" fill="#2e7d32"/>
  <text x="400" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">SSH session (port 22): you type, the Pi runs it</text>

  <!-- Laptop -->
  <rect x="40" y="100" width="180" height="90" rx="8" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-weight="bold" font-size="16" fill="#1f4e79">Your laptop</text>
  <text x="130" y="162" text-anchor="middle" font-size="12" fill="#1f4e79">Terminal / PowerShell</text>

  <!-- Router -->
  <rect x="320" y="110" width="160" height="70" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-weight="bold" font-size="15" fill="#b26a00">Wi-Fi router</text>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#b26a00">same network for both</text>

  <!-- Pi -->
  <rect x="580" y="100" width="180" height="90" rx="8" fill="#fde8ec" stroke="#b71c3c" stroke-width="2"/>
  <text x="670" y="132" text-anchor="middle" font-weight="bold" font-size="16" fill="#b71c3c">Raspberry Pi</text>
  <text x="670" y="152" text-anchor="middle" font-weight="bold" font-size="16" fill="#b71c3c">Zero 2 W</text>
  <text x="670" y="174" text-anchor="middle" font-size="12" fill="#b71c3c">pair1-pi.local</text>

  <!-- Wi-Fi links -->
  <line x1="220" y1="145" x2="320" y2="145" stroke="#222" stroke-width="3" stroke-dasharray="3 5"/>
  <line x1="480" y1="145" x2="580" y2="145" stroke="#222" stroke-width="3" stroke-dasharray="3 5"/>
  <text x="270" y="135" text-anchor="middle" font-size="12" fill="#222">Wi-Fi</text>
  <text x="530" y="135" text-anchor="middle" font-size="12" fill="#222">Wi-Fi</text>

  <!-- Command box -->
  <rect x="40" y="215" width="720" height="62" rx="8" fill="#263238"/>
  <text x="60" y="240" font-family="Courier New, monospace" font-size="15" fill="#a5d6a7">$ ssh pi@pair1-pi.local</text>
  <text x="60" y="264" font-family="Courier New, monospace" font-size="13" fill="#b0bec5">pi@pair1-pi:~ $   &lt;- this prompt means you are now typing on the Pi</text>
</svg>
