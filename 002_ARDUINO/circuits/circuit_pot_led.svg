<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="300" fill="#ffffff"/>
<text x="280" y="22" text-anchor="middle" font-size="15" font-weight="bold">Potentiometer → A0, LED ← pin 9 (Arduino Uno)</text>
<rect x="200" y="50" width="160" height="200" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="280" y="75" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<text x="212" y="120">5V</text><text x="212" y="160">A0</text><text x="212" y="200">GND</text>
<text x="348" y="120" text-anchor="end">~9</text><text x="348" y="200" text-anchor="end">GND</text>
<!-- pot -->
<rect x="30" y="90" width="90" height="30" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
<text x="75" y="110" text-anchor="middle">10kΩ pot</text>
<g stroke="#c62828" stroke-width="2" fill="none"><path d="M120,95 H160 V116 H200"/></g>
<g stroke="#2e7d32" stroke-width="2" fill="none"><path d="M75,120 V156 H200"/></g>
<g stroke="#212121" stroke-width="2" fill="none"><path d="M30,105 H15 V196 H200"/></g>
<text x="140" y="90" fill="#c62828" font-size="11">outer leg → 5V</text>
<text x="80" y="145" fill="#2e7d32" font-size="11">wiper</text>
<text x="20" y="215" font-size="11">other outer leg → GND</text>
<!-- LED -->
<g stroke="#6a1b9a" stroke-width="2" fill="none"><path d="M360,116 H400"/></g>
<rect x="400" y="104" width="50" height="24" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
<text x="425" y="121" text-anchor="middle" font-size="11">220Ω</text>
<g stroke="#6a1b9a" stroke-width="2" fill="none"><path d="M450,116 H490"/></g>
<polygon points="490,100 490,132 520,116" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
<line x1="520" y1="100" x2="520" y2="132" stroke="#c62828" stroke-width="2"/>
<text x="505" y="150" text-anchor="middle" font-size="11">LED (+ → −)</text>
<g stroke="#212121" stroke-width="2" fill="none"><path d="M520,116 H540 V196 H360"/></g>
</svg>
