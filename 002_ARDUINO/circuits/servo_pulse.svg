<path d="M60,80 V50 H80 V80 H460"/>
<path d="M60,170 V140 H90 V170 H460"/>
<path d="M60,260 V230 H100 V260 H460"/>
</g>
<g fill="#333"><text x="470" y="62">1 ms</text><text x="470" y="152">1.5 ms</text><text x="470" y="242">2 ms</text>
<text x="10" y="70">0°</text><text x="10" y="160">90°</text><text x="10" y="250">180°</text></g>
<g stroke="#555" stroke-width="2" fill="none"><path d="M542,70 A28,28 0 0 1 598,70"/><path d="M542,160 A28,28 0 0 1 598,160"/><path d="M542,250 A28,28 0 0 1 598,250"/></g>
<g stroke="#e65100" stroke-width="4" stroke-linecap="round"><line x1="570" y1="70" x2="542" y2="70"/><line x1="570" y1="160" x2="570" y2="132"/><line x1="570" y1="250" x2="598" y2="250"/></g>
