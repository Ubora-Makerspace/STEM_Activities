<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="22" text-anchor="middle" font-size="15" font-weight="bold">I2C LCD (16x2) to Arduino Uno</text>
<rect x="30" y="50" width="160" height="210" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="110" y="72" text-anchor="middle" font-weight="bold">Arduino Uno</text>
<g font-size="12" text-anchor="end"><text x="182" y="174">GND</text><text x="182" y="194">5V</text><text x="182" y="214">A4 (SDA)</text><text x="182" y="234">A5 (SCL)</text></g>
<rect x="400" y="50" width="210" height="210" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
<rect x="420" y="62" width="170" height="80" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
<g font-family="monospace" font-size="14" fill="#1b3a1e"><text x="430" y="95">Hello, Arduino!</text><text x="430" y="122">Dist: 23.5 cm</text></g>
<rect x="400" y="160" width="60" height="90" fill="#1b5e20"/>
<g font-size="11" fill="#fff"><text x="408" y="174">GND</text><text x="408" y="194">VCC</text><text x="408" y="214">SDA</text><text x="408" y="234">SCL</text></g>
<g stroke-width="3" fill="none"><path d="M190,170 H400" stroke="#212121"/><path d="M190,190 H400" stroke="#c62828"/><path d="M190,210 H400" stroke="#1565c0"/><path d="M190,230 H400" stroke="#2e7d32"/></g>
<g font-size="11" fill="#555" text-anchor="middle"><text x="295" y="164">ground</text><text x="295" y="184">power</text><text x="295" y="204">data</text><text x="295" y="224">clock</text></g>
<text x="320" y="288" text-anchor="middle" font-size="12" fill="#555">Only four wires. The I2C address is usually 0x27 or 0x3F.</text>
<text x="320" y="306" text-anchor="middle" font-size="12" fill="#555">If you only see blocks, turn the blue contrast trimmer on the back.</text>
</svg>
