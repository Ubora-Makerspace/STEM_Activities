<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif"><rect width="700" height="400" fill="#ffffff"/><text x="350" y="34" font-size="20" text-anchor="middle" fill="#222222" font-weight="bold">Stepper coil sequence (1 = coil on)</text><text x="235" y="80" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">Step 1</text><text x="345" y="80" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">Step 2</text><text x="455" y="80" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">Step 3</text><text x="565" y="80" font-size="14" text-anchor="middle" fill="#222222" font-weight="bold">Step 4</text><text x="170" y="130" font-size="15" text-anchor="end" fill="#222222" font-weight="bold">IN1</text><rect x="190" y="105" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="235" y="131" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="300" y="105" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="345" y="131" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="410" y="105" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="455" y="131" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="520" y="105" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="565" y="131" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="170" y="185" font-size="15" text-anchor="end" fill="#222222" font-weight="bold">IN2</text><rect x="190" y="160" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="235" y="186" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="300" y="160" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="345" y="186" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="410" y="160" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="455" y="186" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="520" y="160" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="565" y="186" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><text x="170" y="240" font-size="15" text-anchor="end" fill="#222222" font-weight="bold">IN3</text><rect x="190" y="215" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="235" y="241" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="300" y="215" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="345" y="241" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="410" y="215" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="455" y="241" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="520" y="215" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="565" y="241" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><text x="170" y="295" font-size="15" text-anchor="end" fill="#222222" font-weight="bold">IN4</text><rect x="190" y="270" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="235" y="296" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="300" y="270" width="90" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2"/><text x="345" y="296" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">0</text><rect x="410" y="270" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="455" y="296" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="520" y="270" width="90" height="40" rx="6" fill="#2a9d3f" stroke="#555" stroke-width="2"/><text x="565" y="296" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="350" y="350" font-size="14" text-anchor="middle" fill="#222222" font-weight="normal">4 steps = 1 cycle.  512 cycles = 2048 steps = one full turn.</text><text x="350" y="374" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Run the rows in reverse order to turn the other way.</text></svg>